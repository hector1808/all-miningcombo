timezone: "Asia/Ho_Chi_Minh"

wp:
  site_url: "https://blog.mexc.com"
  username_env: "WP_USERNAME"
  app_password_env: "WP_APP_PASSWORD"
  author_id: 159
  language: "en"
  category_ids: [4687]
  # status: "publish"

google_sheet:
  sheet_id_env: "GOOGLE_SHEET_ID"
  worksheet_name: "miningcombo_logs"

openai:
  model: "gpt-5-nano"

defaults:
  question_selector: "p.has-text-align-left.wp-block-paragraph"
  answer_selector: "p.has-text-align-left.wp-block-paragraph"
  question_prefix: "Question:"
  answer_prefix: "Answer:"

crypto_snapshot:
  coingecko_url: "https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=bitcoin,ethereum&price_change_percentage=24h"
  required_phrases:
    - "Bitcoin price"
    - "BTC/USDT"
    - "Ethereum price"
    - "ETH/USDT"

auto_links:
  "Bitcoin price": "https://www.mexc.com/price/BTC"
  "Bitcoin price prediction": "https://www.mexc.com/price-prediction/BTC"
  "Ethereum price": "https://www.mexc.com/price/ETH"
  "Ethereum price prediction": "https://www.mexc.com/price-prediction/ETH"
  "BTC/USDT": "https://www.mexc.com/exchange/BTC_USDT"
  "ETH/USDT": "https://www.mexc.com/exchange/ETH_USDT"

games:
  - game_key: "spur_protocol"
    enabled: true
    source_api_url: "https://miningcombo.com/wp-json/wp/v2/pages/18133"
    template_file: "games/spur-protocol.txt"
    featured_media_id: 337753

    check_answer: "C) Previous block hash."
    answer_heading_contains: "Spur Protocol Quiz Answers Today"
    snapshot_heading_prefix: "Today’s Crypto Market Update"

    title_format: "Spur Protocol Quiz Answers Today - {{CURRENT_DATE_READABLE}}"
    slug_format: "spur-protocol-quiz-answer-today-{{CURRENT_DATE_SLUG}}"
    seo_title_format: "Spur Protocol Quiz Answers Today - {{CURRENT_DATE_READABLE}}"
    meta_description_format: "Today’s Spur Protocol quiz answer for {{CURRENT_DATE_READABLE}}. Learn how Spur Protocol works, how to participate, earn rewards, and track today’s crypto market update."

  - game_key: "syntax_verse"
    enabled: true
    source_api_url: "https://miningcombo.com/wp-json/wp/v2/pages/22199"
    template_file: "games/syntax-verse.txt"
    featured_media_id: 338210

    check_answer: "B) Consistency can compound knowledge and platform progression over time."
    answer_heading_contains: "Syntax Verse Daily Quiz Answer"
    snapshot_heading_prefix: "Today Crypto Market Snapshot"

    title_format: "Today’s Syntax Verse Quiz Answers ({{CURRENT_DATE_READABLE}})"
    slug_format: "syntax-verse-quiz-{{CURRENT_DATE_SLUG}}"
    seo_title_format: "Syntax Verse Quiz Today ({{CURRENT_DATE_READABLE}}) - Daily Answer Updated"
    meta_description_format: "Syntax Verse quiz today's correct answer, updated daily. Solve it inside the app and earn free $SYNTAX tokens in under a minute. "

