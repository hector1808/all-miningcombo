name: MiningCombo Auto Publisher

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Run mode: create or update"
        required: true
        default: "update"
        type: choice
        options:
          - create
          - update

  schedule:
    - cron: "17,37 19 * * *"
    - cron: "17,37,57 0-8 * * *"

jobs:
  create_post:
    if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'create' || github.event.schedule == '17,37 19 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run create mode
        env:
          RUN_MODE: create
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GOOGLE_CREDENTIALS_BASE64: ${{ secrets.GOOGLE_CREDENTIALS_BASE64 }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python main.py

  update_answer:
    if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'update' || github.event.schedule == '17,37,57 0-8 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run update mode
        env:
          RUN_MODE: update
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GOOGLE_CREDENTIALS_BASE64: ${{ secrets.GOOGLE_CREDENTIALS_BASE64 }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python main.py
